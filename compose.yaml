services:
  easylink-server:
    image: wqferan/easylink-server:latest
    restart: unless-stopped
    depends_on:
      - minio
    ports:
      - "127.0.0.1:5033:5033"
    environment:
      SYNCCLIPBOARD_USERNAME: ${EASYLINK_ADMIN_USERNAME:-admin}
      SYNCCLIPBOARD_PASSWORD: ${EASYLINK_ADMIN_PASSWORD:?Set EASYLINK_ADMIN_PASSWORD in .env}
      AppSettings__ApiKeyAuth__Enabled: "true"
      AppSettings__ApiKeyAuth__ValidationUrl: ""
      AppSettings__Database__Provider: sqlite
      AppSettings__NativeNotification__Enabled: "true"
      AppSettings__NativeNotification__Desktop__Enabled: "true"
      AppSettings__PlanEnforcement__Enabled: "false"
      AppSettings__ObjectStorage__Provider: s3
      AppSettings__ObjectStorage__S3__Endpoint: http://minio:9000
      AppSettings__ObjectStorage__S3__PublicBaseUrl: https://${PUBLIC_IP:?Set PUBLIC_IP in .env}:9000
      AppSettings__ObjectStorage__S3__Region: ${S3_REGION:-us-east-1}
      AppSettings__ObjectStorage__S3__Bucket: ${MINIO_BUCKET:-easylink}
      AppSettings__ObjectStorage__S3__AccessKey: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      AppSettings__ObjectStorage__S3__SecretKey: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      AppSettings__ObjectStorage__S3__ForcePathStyle: "true"
      AppSettings__ObjectStorage__S3__UseHttps: "false"
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
    volumes:
      - ./server-data:/app/data

  minio:
    image: ${MINIO_IMAGE:-bitnamilegacy/minio:2023.9.4-debian-11-r3}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET:-easylink}
    volumes:
      - ./miniodata:/bitnami/minio/data

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - easylink-server
      - minio
    ports:
      - "80:80"
      - "443:443"
      - "9000:9000"
    environment:
      PUBLIC_IP: ${PUBLIC_IP:?Set PUBLIC_IP in .env}
    volumes:
      - ./nginx/standalone-ip.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./letsencrypt:/etc/letsencrypt:ro

  nginx-acme-bootstrap:
    image: nginx:stable-alpine
    restart: unless-stopped
    profiles:
      - certificate-setup
    ports:
      - "80:80"
    volumes:
      - ./nginx/acme-bootstrap.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro

  certbot-issue:
    image: certbot/certbot:v5.8.0
    profiles:
      - certificate-setup
    environment:
      PUBLIC_IP: ${PUBLIC_IP:?Set PUBLIC_IP in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    entrypoint: ["certbot"]
    command:
      - certonly
      - --non-interactive
      - --agree-tos
      - --email
      - ${ACME_EMAIL:?Set ACME_EMAIL in .env}
      - --webroot
      - --webroot-path
      - /var/www/certbot
      - --preferred-profile
      - shortlived
      - --ip-address
      - ${PUBLIC_IP:?Set PUBLIC_IP in .env}
      - --cert-name
      - easylink-ip
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

  certbot-renew:
    image: certbot/certbot:v5.8.0
    restart: unless-stopped
    depends_on:
      - nginx
    pid: service:nginx
    entrypoint: ["/bin/sh", "-c"]
    command: |
      while :; do
        certbot renew --quiet --deploy-hook 'kill -HUP 1' || echo 'Certbot renewal failed; will retry.' >&2
        sleep 12h
      done
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
